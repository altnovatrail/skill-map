version: 2

updates:
  # The actions of the workflows, and the references to .github's shared workflows with them.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      # Every reference to a shared workflow of .github in one pull request, to one release:
      # Dependabot names each altnovatrail/.github/.github/workflows/<file>.yml.
      shared-workflows:
        patterns: ["altnovatrail/.github/*"]

  - package-ecosystem: docker
    directory: /.devcontainer
    schedule:
      interval: weekly
    cooldown:
      default-days: 3

  # The npm packages the code is built and checked with (R08). The browser the
  # tests run in is no package: it comes with the toolchain stage of .devcontainer/Dockerfile, from
  # spec's template, and a pull request that raises playwright stays red until the image there is
  # raised with it, by hand (R79 spec).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      # @vitest/browser-playwright and @vitest/coverage-v8 pin vitest exactly, so the three move in
      # one pull request. Vite, which vitest runs on, moves with them.
      vitest:
        patterns: ["vitest", "@vitest/*", "vite"]
    ignore:
      # The types of Node follow the major version of the Node in .devcontainer/Dockerfile, which
      # moves by hand.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # The types of the module format and the contracts are spec's, at the version of the tag the
      # spec/ submodule stands on: they move with it, in a move to a new tag of spec (R73 spec,
      # R83 spec), and ci-licenses checks their signatures by spec's release-verify-npm (R77 spec).
      - dependency-name: "@altnovatrail/spec"
      - dependency-name: "@altnovatrail/contracts"
      # The icon set is raised together with canvas and app, only by a row of spec's COORDINATION.md:
      # canvas and skill-map come out with the new version, then app takes both with its own set at
      # the same version. A branch of that row raises it here with just icons (R10; R78 spec).
      - dependency-name: "@iconify-json/material-symbols"
