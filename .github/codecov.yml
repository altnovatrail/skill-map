# What Codecov does with the coverage of the tests, which the coverage job of .github's shared
# typescript.yml uploads (R48 spec; R08 in docs/decisions.md): the lcov report ci-test writes,
# coverage/lcov.info.

coverage:
  status:
    # New and changed lines are covered at 90 % at least (R48 spec). The ruleset of main requires
    # this check once a pull request has shown that it comes. A pull request that changes no line
    # of the report, the documents alone, passes as "Coverage not affected".
    patch:
      default:
        target: 90%
    # On the plan Codecov gives a public repository, it sets no project status (R48 spec). Should
    # it ever set one, it only informs: the badge shows the coverage of the whole.
    project:
      default:
        informational: true

# As spec's: a comment only when the coverage changes, with the diff and the files.
comment:
  layout: "condensed_header, diff, files"
  require_changes: true
